name: 贡献者交付验收
description: 登记一次贡献者或 AI agent 的交付
title: "[Delivery] "
labels: [delivery]
body:
  - type: input
    id: pr
    attributes:
      label: PR 与 commit SHA
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 改动范围与已知限制
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 测试、Actions 与产物 SHA256
      description: 只报告真实执行结果；未执行的项目明确标注。
    validations:
      required: true
